{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar | Adota+</title>

    <link rel="stylesheet" href="{% static 'core/css/style.css' %}?v=5">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            🐾 Adota+
        </div>

        <nav>
            <a href="/">Início</a>
            <a href="#">Animais</a>
            <a href="#">Sobre nós</a>
            <a href="#">Contato</a>
        </nav>

        <div class="navbar-buttons">
            <a href="#" class="btn-register">Cadastrar</a>
        </div>

    </header>


    <main class="login-container">

        <div class="login-box">

            <h1>Entrar</h1>

            <p class="login-subtitle">
                Entre na sua conta para continuar.
            </p>

            <form method="POST">

                {% csrf_token %}
                <input type="hidden" name="next" value="{{ request.GET.next }}">

                <div class="form-group">

                    <label for="username">
                        Usuário
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                    >

                </div>


                {% if erro %}

                    <p class="login-error">
                        {{ erro }}
                    </p>

                {% endif %}


                <button type="submit" class="btn-login-form">
                    Entrar
                </button>

                <div class="recuperar-senha-link">
                    <a href="{% url 'password_reset' %}">
                        Esqueceu sua senha?
                    </a>
                </div>

            </form>


            <p class="cadastro-link">

                Ainda não possui uma conta?

                <a href="#">
                    Cadastre-se
                </a>

            </p>

        </div>

    </main>


    <footer>

        <p>
            © 2026 Adota+ — Todos os direitos reservados.
        </p>

    </footer>

</body>

</html>
