
{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Senha redefinida | Adota+</title>

    <link rel="stylesheet" href="{% static 'core/css/style.css' %}?v=19">
</head>

<body>

    <header class="navbar">
        <div class="logo">🐾 Adota+</div>

        <nav>
            <a href="{% url 'inicio' %}">Início</a>
            <a href="{% url 'login' %}">Entrar</a>
        </nav>
    </header>

    <main class="login-container">

        <div class="login-box">

            <div class="recuperacao-icone">
                ✓
            </div>

            <h1>Senha alterada!</h1>

            <p class="login-subtitle">
                Sua senha foi redefinida com sucesso.
                Agora você já pode acessar sua conta
                utilizando sua nova senha.
            </p>

            <a href="{% url 'login' %}" class="recuperacao-botao">
                Fazer login
            </a>

        </div>

    </main>

    <footer>
        <p>© 2026 Adota+ — Todos os direitos reservados.</p>
    </footer>

</body>
</html>
